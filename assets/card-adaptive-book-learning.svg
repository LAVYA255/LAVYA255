<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 158" width="436" height="158" role="img" aria-label="adaptive-book-learning: Turns any book into a personalized course.">
<defs><style>text{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.hd{fill:#7A7A8C;font-size:11px;letter-spacing:.22em}.sm{fill:#7A7A8C;font-size:10.5px}</style><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="bloom" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1.5" fill="#FFFFFF" opacity=".045"/></pattern><radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="55%" stop-color="#000000" stop-opacity="0"/><stop offset="100%" stop-color="#000000" stop-opacity=".6"/></radialGradient></defs>
<rect width="436" height="158" fill="#05050A"/>
<rect x="1" y="1" width="434" height="156" fill="#0C0C14" stroke="#FFB000" stroke-width="2" filter="url(#glow)"/>
<rect x="1" y="1" width="434" height="5" fill="#FFB000" filter="url(#glow)"/>
<text x="20" y="36" style="font-size:15px;font-weight:700;letter-spacing:.04em;fill:#F0F0F5">adaptive-book-learning</text>
<text x="20" y="54" style="font-size:9.5px;letter-spacing:.18em;fill:#FFB000" filter="url(#glow)">AI · FULL-STACK</text>
<text x="20" y="78" class="sm">Turns any book into a personalized course.</text>
<text x="20" y="94" class="sm">Claude builds a knowledge graph, then teaches</text>
<text x="20" y="110" class="sm">and grades you.</text>
<rect x="20" y="124" width="106" height="18" fill="#05050A" stroke="#2A2A3A"/>
<text x="73" y="137" text-anchor="middle" style="font-size:8.5px;letter-spacing:.1em;fill:#7A7A8C">KNOWLEDGE GRAPH</text>
<rect x="134" y="124" width="106" height="18" fill="#05050A" stroke="#2A2A3A"/>
<text x="187" y="137" text-anchor="middle" style="font-size:8.5px;letter-spacing:.1em;fill:#7A7A8C">SPACED REVISION</text>
<text x="416" y="36" text-anchor="end" style="font-size:10px;letter-spacing:.16em;fill:#FFB000" filter="url(#glow)">▸ PLAY</text>
<rect width="436" height="158" fill="url(#scan)"/><rect width="436" height="158" fill="url(#vig)"/>
